<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Vibrant Indigo to Electric Cyan -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Top facet of 3D box -->
    <linearGradient id="topFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>

    <!-- Left facet of 3D box -->
    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Right facet of 3D box -->
    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Laser Scanner Glow -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="25%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Rich Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Isometric 3D Crate / Warehouse Package -->
  <g id="boxGroup" transform="translate(0, -12)">
    <!-- Top Face -->
    <polygon points="256,118 392,190 256,262 120,190" fill="url(#topFacet)"/>
    <polygon points="256,118 392,190 256,262 120,190" fill="#ffffff" opacity="0.2"/>
    <!-- Top Seam Tape -->
    <polygon points="236,128 276,108 276,252 236,272" fill="#f59e0b" opacity="0.9"/>

    <!-- Left Face -->
    <polygon points="120,190 256,262 256,390 120,318" fill="url(#leftFacet)"/>
    
    <!-- Right Face -->
    <polygon points="256,262 392,190 392,318 256,390" fill="url(#rightFacet)"/>

    <!-- Front Edge Accent -->
    <line x1="256" y1="262" x2="256" y2="390" stroke="#ffffff" stroke-width="3" opacity="0.35"/>
  </g>

  <!-- Stylized Barcode Overlay Badge in Front -->
  <g transform="translate(132, 290)">
    <!-- Barcode Container Badge -->
    <rect x="0" y="0" width="248" height="98" rx="18" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="3" y="3" width="242" height="92" rx="15" fill="#0f172a"/>
    
    <!-- Vertical Barcode Stripes -->
    <g fill="#38bdf8">
      <rect x="18" y="15" width="6" height="52" rx="2"/>
      <rect x="30" y="15" width="14" height="52" rx="2"/>
      <rect x="50" y="15" width="4" height="52" rx="1"/>
      <rect x="60" y="15" width="10" height="52" rx="2"/>
      <rect x="76" y="15" width="16" height="52" rx="2"/>
      <rect x="98" y="15" width="6" height="52" rx="2"/>
      <rect x="110" y="15" width="14" height="52" rx="2"/>
      <rect x="130" y="15" width="4" height="52" rx="1"/>
      <rect x="140" y="15" width="18" height="52" rx="2"/>
      <rect x="164" y="15" width="8" height="52" rx="2"/>
      <rect x="178" y="15" width="4" height="52" rx="1"/>
      <rect x="188" y="15" width="14" height="52" rx="2"/>
      <rect x="210" y="15" width="20" height="52" rx="2"/>
    </g>

    <!-- Horizontal Neon Red Laser Beam across Barcode -->
    <rect x="8" y="38" width="232" height="6" rx="3" fill="url(#laserGrad)" filter="url(#glow)"/>
    
    <!-- Code Text -->
    <text x="124" y="84" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="4">BARCODE WES</text>
  </g>

  <!-- Sparkle Accent in top-right -->
  <polygon points="418,78 425,95 442,102 425,109 418,126 411,109 394,102 411,95" fill="#fbbf24" opacity="0.95"/>
  <circle cx="448" cy="68" r="4.5" fill="#ffffff" opacity="0.85"/>
</svg>